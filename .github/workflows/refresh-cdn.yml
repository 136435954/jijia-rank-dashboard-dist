name: Refresh CDN Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache
        run: |
          curl -sS -o /dev/null -w "purge status: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/136435954/jijia-rank-dashboard-dist@main/README.md"