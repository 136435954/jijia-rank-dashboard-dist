name: Sync Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          git config user.name "mirror-sync"
          git config user.email "mirror-sync@users.noreply.github.com"
          git remote add mirror "https://oauth2:${TOKEN}@gitee.com/yan-tiantian/jijia-rank-dashboard-dist.git"
          git push --force mirror "HEAD:refs/heads/master"
